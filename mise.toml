[settings]
experimental = true

[tools]
dotnet = "10.0.400"
hk = "1.58.1"
actionlint = "1.7.12"
gitleaks = "8.30.1"
zizmor = "1.30.0"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

[hooks]
postinstall = "mise deps install"

[deps.dotnet]
description = "Restore NuGet packages"
sources = ["**/*.csproj", "ArchUnit.sln"]
run = "dotnet restore ArchUnit.sln"
auto = true

[deps.dotnet-tools]
description = "Restore local .NET tools (csharpier, verify.tool, reportgenerator)"
sources = [".config/dotnet-tools.json"]
run = "dotnet tool restore"
auto = true
