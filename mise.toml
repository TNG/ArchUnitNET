[settings]
experimental = true

[tools]
dotnet = "10.0.400"
hk = "1.56.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
zizmor = "1.29.0"

[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

[hooks]
postinstall = "mise deps install"

[deps.dotnet]
description = "Restore NuGet packages"
sources = ["**/*.csproj", "ArchUnit.sln"]
run = "dotnet restore ArchUnit.sln"
auto = true

[deps.dotnet-tools]
description = "Restore local .NET tools (csharpier, verify.tool, reportgenerator)"
sources = [".config/dotnet-tools.json"]
run = "dotnet tool restore"
auto = true

[tasks."test:vstest"]
description = "Run all VSTest-based test projects"
run = "dotnet test -c Debug ArchUnitNET.vstest.slnf"

[tasks."test:mtp"]
description = "Run the TUnit (MTP) test project"
dir = "ArchUnitNET.TUnitTests"
run = "dotnet test -c Debug ../ArchUnitNET.mtp.slnf"

[tasks.test]
description = "Run all tests (VSTest and MTP in parallel)"
depends = ["test:vstest", "test:mtp"]
